<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusEvents — Student Event Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            peach: {
              50: '#fff7f2',
              100: '#ffede5',
              200: '#ffd3b9',
              300: '#ffb38a',
              400: '#fa8f58',
              500: '#f2733a',
              600: '#de5522',
              700: '#b83f17',
              800: '#933417',
              900: '#772d17',
            }
          }
        }
      }
    };
  </script>
  <script>
    // Theme initialization
    const savedTheme = localStorage.getItem('campus_theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
      document.documentElement.classList.add('dark');
    }

    // Instant authentication redirect
    try {
      const token = localStorage.getItem('token');
      if (token) {
        window.location.replace('/dashboard.html');
      } else {
        window.location.replace('/login.html');
      }
    } catch (e) {
      window.location.replace('/login.html');
    }
  </script>
</head>
<body class="bg-peach-50 dark:bg-stone-950 text-stone-800 dark:text-stone-100 min-h-screen flex items-center justify-center p-4">
  <div class="text-center space-y-4">
    <div class="w-12 h-12 mx-auto rounded-2xl bg-peach-500 text-white flex items-center justify-center animate-spin">
      <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
    </div>
    <p class="text-sm font-semibold text-stone-600 dark:text-stone-300">Loading CampusEvents Portal...</p>
    <div class="space-x-3 text-xs">
      <a href="/login.html" class="text-peach-600 hover:underline">Go to Login</a>
      <span>&bull;</span>
      <a href="/dashboard.html" class="text-peach-600 hover:underline">Go to Dashboard</a>
    </div>
  </div>
</body>
</html>
